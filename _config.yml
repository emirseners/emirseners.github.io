# Personal site
title: Ahmet Emir Şener
first_name: Ahmet Emir
last_name: Şener
description: >
  Ahmet Emir Şener is an M.S. student in Industrial Engineering at
  Boğaziçi University with research interests in stochastic and convex optimization.
lang: en
url: https://emirseners.github.io
baseurl: ""
timezone: Europe/Istanbul
footer_text: >
  Powered by <a href="https://jekyllrb.com/">Jekyll</a> and
  <a href="https://github.com/alshedivat/al-folio">al-folio</a>.

# Theme runtime contract
theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false

# Layout
navbar_fixed: true
footer_fixed: true
max_width: 930px
enable_darkmode: true
search_enabled: false
enable_masonry: false
enable_math: false
enable_medium_zoom: false
enable_progressbar: false
back_to_top: false

# Metadata
serve_og_meta: true
serve_schema_org: false

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
keep_files:
  - CNAME
  - .nojekyll
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-link-attributes
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_icons
sass:
  style: compressed
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
external_links:
  enabled: true
  rel: external noopener
  target: _blank

# Fonts and icons used by the theme
third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css"
    version: "7.2.0"
  academicons:
    integrity:
      css: "sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw="
    url:
      css: "https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css"
    version: "1.9.5"
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
